services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: minhasenha
    ports:
      - "3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysql", "-u", "root", "-pminhasenha", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  payment:
    build:
      context: ..
      dockerfile: microservices/payment/Dockerfile
    environment:
      DB_DRIVER: mysql
      DATA_SOURCE_URL: root:minhasenha@tcp(mysql:3306)/payment?parseTime=true
      APPLICATION_PORT: 3001
      ENV: development
    ports:
      - "3001:3001"
    depends_on:
      mysql:
        condition: service_healthy

  shipping:
    build:
      context: ..
      dockerfile: microservices/shipping/Dockerfile
    environment:
      DATA_SOURCE_URL: root:minhasenha@tcp(mysql:3306)/shipping?parseTime=true
      APPLICATION_PORT: 3002
      ENV: development
    ports:
      - "3002:3002"
    depends_on:
      mysql:
        condition: service_healthy

  order:
    build:
      context: ..
      dockerfile: microservices/order/Dockerfile
    environment:
      DATA_SOURCE_URL: root:minhasenha@tcp(mysql:3306)/order?parseTime=true
      APPLICATION_PORT: 3000
      ENV: development
      PAYMENT_SERVICE_URL: payment:3001
      SHIPPING_SERVICE_URL: shipping:3002
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      payment:
        condition: service_started
      shipping:
        condition: service_started

  seed:
    image: mysql:8.0
    command: >
      sh -c "sleep 15 && mysql -h mysql -u root -pminhasenha order -e \"
        INSERT IGNORE INTO products (product_code, name, quantity, created_at, updated_at) VALUES
        ('PROD-A', 'Notebook', 10, NOW(), NOW()),
        ('PROD-B', 'Mouse', 50, NOW(), NOW()),
        ('PROD-C', 'Teclado', 30, NOW(), NOW()),
        ('PROD-D', 'Monitor', 5, NOW(), NOW()),
        ('PROD-E', 'Headset', 20, NOW(), NOW());
      \""
    depends_on:
      order:
        condition: service_started
    restart: "no"
